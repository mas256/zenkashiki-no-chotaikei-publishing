# 最新成功ビルドと最新正式版をPagesへ配信する。
# main に置く。起動元のTagやCommitは使わず、実行時点で最新正式版を再計算する。
name: Deploy Pages

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/pages.yml
  workflow_run:
    workflows: [Release, Build]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

defaults:
  run:
    shell: bash

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Determine the latest release
        run: |
          source scripts/lib/common.sh
          latest="$(latest_release)"
          if [ -z "$latest" ]; then
            echo "::error::PDFとSHA-256がそろった公開済みReleaseがありません"
            exit 1
          fi
          echo "::notice::PDFとSHA-256がそろった最新の正式版を使用します: $latest"
          echo "LATEST=$latest" >> "$GITHUB_ENV"
          echo "最新正式版: $latest"

      - name: Download PDF and checksum from the release
        run: |
          gh release download "$LATEST" --pattern '*.pdf' --pattern '*.pdf.sha256' --dir dist
          shopt -s nullglob
          pdfs=(dist/*.pdf)
          sums=(dist/*.pdf.sha256)
          [ "${#pdfs[@]}" -eq 1 ] || { echo "::error::PDFがちょうど1つではありません"; exit 1; }
          [ "${#sums[@]}" -eq 1 ] || { echo "::error::.sha256がちょうど1つではありません"; exit 1; }

      - name: Verify checksum
        run: |
          (cd dist && sha256sum -c ./*.pdf.sha256)
          actual="$(sha256sum dist/*.pdf | cut -d' ' -f1)"
          digest="$(gh api "repos/$GH_REPO/releases/tags/$LATEST" \
            --jq '[.assets[] | select(.name | endswith(".pdf")) | .digest][0] // ""')"
          if [ -n "$digest" ]; then
            [ "$digest" = "sha256:$actual" ] || { echo "::error::APIのdigestが一致しません"; exit 1; }
          else
            echo "::warning::assetのdigestがAPIから取得できませんでした"
          fi

      - name: Build site
        run: bash ./scripts/pages-build.sh

      - name: Add latest successful PDF
        run: |
          source scripts/lib/common.sh
          latest_tag="$(latest_build_release)"
          if [ -n "$latest_tag" ]; then
            mkdir -p latest-dist
            gh release download "$latest_tag" --pattern main.pdf --pattern main.pdf.sha256 --pattern latest-build.json --dir latest-dist
            (cd latest-dist && sha256sum -c main.pdf.sha256)
            python3 - "$latest_tag" <<'PY'
          import json, sys
          from pathlib import Path
          tag = sys.argv[1]
          info = json.loads(Path("latest-dist/latest-build.json").read_text())
          assert info["run_number"] == int(tag.removeprefix("latest-build-")), "Run number mismatch"
          PY
            actual="$(sha256sum latest-dist/main.pdf | cut -d' ' -f1)"
            digest="$(gh api "repos/$GH_REPO/releases/tags/$latest_tag" \
              --jq '[.assets[] | select(.name == "main.pdf") | .digest][0] // ""')"
            if [ -n "$digest" ]; then
              [ "$digest" = "sha256:$actual" ] || { echo "::error::最新版PDFのAPI digestが一致しません"; exit 1; }
            fi
            cp latest-dist/main.pdf site/latest.pdf
          else
            echo "::warning::最新版PDFがまだ公開されていないため、正式版だけをPagesへ配信します"
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
