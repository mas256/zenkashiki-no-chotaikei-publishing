# mainへの成功ビルドはActions成果物として保存し、Pages Workflowが最新版PDFを配信する。
name: Build

on:
  push:
    branches:
      - main
      - 'release/**'
    paths:
      - '発展-new/**'
      - 'tex/**'
      - '.github/workflows/**'
      - '.github/texlive/**'
      - 'scripts/**'
      - 'tests/**'
  pull_request:
    paths:
      - '発展-new/**'
      - 'tex/**'
      - '.github/workflows/**'
      - '.github/texlive/**'
      - 'scripts/**'
      - 'tests/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: ./.github/workflows/_build.yml
    with:
      artifact-name: latex-build
      retention-days: 7
