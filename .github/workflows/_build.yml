# 再利用可能なBuild。build.yml と release.yml が共通で呼ぶ。
# Build環境(コンテナイメージ)はこのファイルにだけ書く。
name: Build (reusable)

on:
  workflow_call:
    inputs:
      ref:
        description: "Build対象のCommit SHA。空なら呼び出し元のrefをBuildする"
        type: string
        default: ""
      artifact-name:
        type: string
        default: latex-build
      retention-days:
        type: number
        default: 7

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      MAIN_TEX: 漸化式の超体系的解説.tex
      COMMIT: ${{ inputs.ref != '' && inputs.ref || github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Verify manuscript math style
        run: |
          python3 tests/test-math-style.py
          python3 scripts/verify-math-style.py

      - name: Cache the frozen TeX Live toolchain
        id: texlive_cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/texlive
          key: texlive-2025-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/setup-texlive.sh', '.github/texlive/packages.txt') }}

      - name: Set up TeX Live
        env:
          TEXLIVE_ROOT: ${{ runner.temp }}/texlive
        run: |
          bash scripts/setup-texlive.sh
          echo "$TEXLIVE_ROOT/bin/x86_64-linux" >> "$GITHUB_PATH"
          echo "TOOLCHAIN_REF=$(cat "$TEXLIVE_ROOT/repository.txt")" >> "$GITHUB_ENV"

      - name: Save the prepared TeX Live toolchain
        if: steps.texlive_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/texlive
          key: ${{ steps.texlive_cache.outputs.cache-primary-key }}

      - name: Verify common math commands
        run: |
          mkdir -p out/math-style
          uplatex -halt-on-error -interaction=nonstopmode -file-line-error -output-directory=out/math-style tests/tex/book-math.tex

      - name: Build (upLaTeX + dvipdfmx via latexmk)
        working-directory: 発展-new
        run: max_print_line=1000 latexmk "$MAIN_TEX"

      - name: Generate the smartphone PDF from the A4 manuscript
        run: python3 scripts/build-mobile.py

      - name: Verify both layouts
        run: python3 scripts/verify-tex-layout.py "out/latex-aux/${MAIN_TEX%.tex}.log" out/mobile/mobile.log

      - name: Verify embedded fonts
        working-directory: 発展-new
        run: |
          pdf="${MAIN_TEX%.tex}.pdf"
          if ! command -v pdffonts >/dev/null 2>&1 || [ ! -d /usr/share/poppler/cMap/Adobe-Japan1 ]; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq --no-install-recommends poppler-utils poppler-data
          fi
          for variant in a4 mobile; do
            if [ "$variant" = a4 ]; then pdf="${MAIN_TEX%.tex}.pdf"; else pdf=../out/mobile/mobile.pdf; fi
            fonts="fonts-$variant.txt"
            pdffonts "$pdf" | tee "$fonts"
            missing="$(awk 'NR>2 && NF>=5 && $(NF-4)!="yes"' "$fonts")"
            [ -z "$missing" ] || { echo "::error::$variant: 埋め込まれていないフォント: $missing"; exit 1; }
            grep -q 'HaranoAji' "$fonts" || { echo "::error::$variant: 原ノ味フォントがありません"; exit 1; }
          done

      - name: Verify both page dimensions
        working-directory: 発展-new
        run: |
          python3 ../scripts/verify-pdf-a4.py "${MAIN_TEX%.tex}.pdf"
          python3 ../scripts/verify-pdf-a4.py ../out/mobile/mobile.pdf --width-mm 90 --height-mm 160

      - name: Verify learning paths, examples, and PDF destinations
        run: |
          node scripts/verify-learning-design.mjs --pdf
          node scripts/verify-learning-design.mjs --pdf out/mobile/mobile.pdf
          node tests/verify-learning-navigation.mjs
          python3 tests/test-mobile-publishing.py

      - name: Verify recurrence connections with exact arithmetic
        run: |
          python3 scripts/verify-issue26-connections.py
          python3 tests/test-chapter3-commentary.py

      - name: Verify glossary and exercise navigation
        run: |
          python3 scripts/verify-reading-navigation.py --pdf '発展-new/漸化式の超体系的解説.pdf'
          python3 scripts/verify-reading-navigation.py --pdf out/mobile/mobile.pdf

      - name: Verify PDF link margins
        run: |
          python3 scripts/verify-pdf-link-margins.py '発展-new/漸化式の超体系的解説.pdf'
          python3 scripts/verify-pdf-link-margins.py out/mobile/mobile.pdf --header-height 26 --footer-height 12

      - name: Verify term first-use decoration
        run: python3 scripts/verify-term-first-use.py

      - name: Collect outputs and build-info
        working-directory: 発展-new
        run: |
          mkdir -p ../out
          cp "${MAIN_TEX%.tex}.pdf" ../out/main.pdf
          cp ../out/mobile/mobile.pdf ../out/mobile.pdf
          cp fonts-a4.txt ../out/fonts.txt
          cp fonts-mobile.txt ../out/fonts-mobile.txt
          BUILT_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          TL_VERSION="$(uplatex --version | sed -n 1p)"
          DVIPDFMX_VERSION="$(dvipdfmx --version 2>&1 | sed -n 1p)"
          FONTS="$(awk 'FNR>2 {print $1}' fonts-a4.txt fonts-mobile.txt | sort -u)"
          export BUILT_AT TL_VERSION DVIPDFMX_VERSION FONTS
          perl -MJSON::PP -e '
            my %h = (
              commit   => $ENV{COMMIT},
              built_at => $ENV{BUILT_AT},
              toolchain => $ENV{TOOLCHAIN_REF},
              tex      => $ENV{TL_VERSION},
              dvipdfmx => $ENV{DVIPDFMX_VERSION},
              fonts    => [ split /\n/, $ENV{FONTS} ],
            );
            print JSON::PP->new->canonical->pretty->encode(\%h);
          ' > ../out/build-info.json
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          output = Path('../out')
          info = json.loads((output / 'build-info.json').read_text())
          info['pdfs'] = {name: {'sha256': hashlib.sha256((output / filename).read_bytes()).hexdigest()}
                          for name, filename in [('a4', 'main.pdf'), ('mobile', 'mobile.pdf')]}
          (output / 'build-info.json').write_text(json.dumps(info, indent=2) + '\n')
          PY
          cat ../out/build-info.json

      - name: Upload build outputs
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact-name }}
          path: |
            out/*.pdf
            out/*.txt
            out/build-info.json
          retention-days: ${{ inputs.retention-days }}
          compression-level: 0
          if-no-files-found: error
