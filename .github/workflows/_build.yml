# 再利用可能なBuild。build.yml と release.yml が共通で呼ぶ。
# Build環境(コンテナイメージ)はこのファイルにだけ書く。
name: Build (reusable)

on:
  workflow_call:
    inputs:
      ref:
        description: "Build対象のCommit SHA。空なら呼び出し元のrefをBuildする"
        type: string
        default: ""
      artifact-name:
        type: string
        default: latex-build
      retention-days:
        type: number
        default: 7

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      MAIN_TEX: 漸化式の超体系的解説.tex
      COMMIT: ${{ inputs.ref != '' && inputs.ref || github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Cache the frozen TeX Live toolchain
        id: texlive_cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/texlive
          key: texlive-2025-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/setup-texlive.sh', '.github/texlive/packages.txt') }}

      - name: Set up TeX Live
        env:
          TEXLIVE_ROOT: ${{ runner.temp }}/texlive
        run: |
          bash scripts/setup-texlive.sh
          echo "$TEXLIVE_ROOT/bin/x86_64-linux" >> "$GITHUB_PATH"
          echo "TOOLCHAIN_REF=$(cat "$TEXLIVE_ROOT/repository.txt")" >> "$GITHUB_ENV"

      - name: Save the prepared TeX Live toolchain
        if: steps.texlive_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/texlive
          key: ${{ steps.texlive_cache.outputs.cache-primary-key }}

      - name: Build (upLaTeX + dvipdfmx via latexmk)
        working-directory: 発展-new
        run: latexmk "$MAIN_TEX"

      - name: Verify learning paths and examples
        run: node scripts/verify-learning-design.mjs

      - name: Check unresolved references
        working-directory: 発展-new
        run: |
          log="${MAIN_TEX%.tex}.log"
          if grep -Eq 'There were undefined references|Citation .* undefined|Reference .* undefined' "$log"; then
            grep -En 'undefined' "$log" | head -n 20
            echo "::error::未解決の参照があります"
            exit 1
          fi

      - name: Verify embedded fonts
        working-directory: 発展-new
        run: |
          pdf="${MAIN_TEX%.tex}.pdf"
          if ! command -v pdffonts >/dev/null 2>&1 || [ ! -d /usr/share/poppler/cMap/Adobe-Japan1 ]; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq --no-install-recommends poppler-utils poppler-data
          fi
          pdffonts "$pdf" | tee fonts.txt
          # 末尾5列は emb sub uni object gen。emb が yes 以外のフォントを検出する。
          missing="$(awk 'NR>2 && NF>=5 && $(NF-4)!="yes"' fonts.txt)"
          if [ -n "$missing" ]; then
            echo "$missing"
            echo "::error::PDFに埋め込まれていないフォントがあります"
            exit 1
          fi
          if ! grep -q 'HaranoAji' fonts.txt; then
            echo "::error::原ノ味フォント(HaranoAji)が埋め込まれていません"
            exit 1
          fi

      - name: Preview revised pages for editorial review
        if: startsWith(github.ref, 'refs/heads/release/learning-design-')
        working-directory: 発展-new
        run: |
          python3 - <<'PY'
          import base64, pathlib, re, subprocess
          pdf = "漸化式の超体系的解説.pdf"
          print(subprocess.check_output(["pdfinfo", pdf], text=True))
          text = subprocess.check_output(["pdftotext", pdf, "-"], text=True)
          pages = text.split("\f")
          markers = ["以下の5問は", "定数項を消すために", "ここでは一般項まで一気に計算する前に", "初回からすべての問題を解く必要はない"]
          selected = []
          for marker in markers:
              matches = [i + 1 for i, page in enumerate(pages) if marker in re.sub(r"\s+", "", page)]
              if not matches:
                  raise RuntimeError("Preview marker missing: " + marker)
              selected.append(matches[0])
          out = pathlib.Path("../out")
          out.mkdir(exist_ok=True)
          for page in sorted(set(selected)):
              prefix = out / ("preview-page-" + str(page))
              subprocess.run(["pdftoppm", "-f", str(page), "-l", str(page), "-singlefile", "-scale-to", "1400", "-png", pdf, str(prefix)], check=True)
              encoded = base64.b64encode(prefix.with_suffix(".png").read_bytes()).decode()
              for start in range(0, len(encoded), 8192):
                  print("CODEX_PREVIEW_" + str(page) + "_CHUNK_" + str(start // 8192) + ":" + encoded[start:start+8192])
          print("CODEX_PREVIEW_PAGES:" + ",".join(map(str, sorted(set(selected)))))
          PY

      - name: Collect outputs and build-info
        working-directory: 発展-new
        run: |
          mkdir -p ../out
          cp "${MAIN_TEX%.tex}.pdf" ../out/main.pdf
          cp fonts.txt ../out/fonts.txt
          BUILT_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          TL_VERSION="$(uplatex --version | sed -n 1p)"
          DVIPDFMX_VERSION="$(dvipdfmx --version 2>&1 | sed -n 1p)"
          FONTS="$(awk 'NR>2 {print $1}' fonts.txt | sort -u)"
          export BUILT_AT TL_VERSION DVIPDFMX_VERSION FONTS
          perl -MJSON::PP -e '
            my %h = (
              commit   => $ENV{COMMIT},
              built_at => $ENV{BUILT_AT},
              toolchain => $ENV{TOOLCHAIN_REF},
              tex      => $ENV{TL_VERSION},
              dvipdfmx => $ENV{DVIPDFMX_VERSION},
              fonts    => [ split /\n/, $ENV{FONTS} ],
            );
            print JSON::PP->new->canonical->pretty->encode(\%h);
          ' > ../out/build-info.json
          cat ../out/build-info.json

      - name: Upload build outputs
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact-name }}
          path: out/
          retention-days: ${{ inputs.retention-days }}
          compression-level: 0
          if-no-files-found: error
